name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --no-fail-fast
        env:
          # The runners' filesystem filter drivers break fs_at's reparse
          # probe on plain directories; see the fs_at note in Cargo.toml.
          FS_AT_WORKAROUND_PROCMON: 1

  rule-coverage:
    name: Rule Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Report-only for now: the report is printed but the step never fails.
      # The four wiki homepage rules are bound and verified. --strict still
      # cannot be added because the scan flags ~66 directive-shaped fixture
      # strings inside coverage and scanner tests (unknown rule ids, legacy
      # @statesman markers). Add --strict once those fixtures are excluded
      # from the scan or rewritten so the parser skips them.
      - run: cargo run -p provenance-cli -- coverage scan --repo . --path crates --scope default --validate-rules

  wiki-dom:
    name: Wiki DOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:dom
